name: SENTINEL One-Time 10-Year Historical Backfill

on:
  workflow_dispatch:

jobs:
  execute-sentinel-backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: pip install requests google-cloud-bigquery

      - name: Execute Federal Policy Backfill
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python sentinel_backfill_10y.py
        
