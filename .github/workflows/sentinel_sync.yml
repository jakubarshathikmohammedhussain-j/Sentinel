name: SENTINEL+ Execution Node (Policy)

on:
  schedule:
    # Runs daily at 14:00 UTC (Monday - Friday)
    - cron: '0 14 * * 1-5'
  workflow_dispatch:

jobs:
  execute-sentinel:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install Dependencies
        run: pip install requests google-cloud-bigquery
        
      - name: Execute SENTINEL Stream
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python sentinel_sync.py
        
